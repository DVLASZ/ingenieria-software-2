server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: validation-service
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1s
          max-attempts: 3
          multiplier: 2

# Nombres de los exchanges (comandos y eventos), iguales en todos los servicios
app:
  messaging:
    direct-exchange: ${DIRECT_EXCHANGE:saberpro.direct.exchange}
    topic-exchange: ${TOPIC_EXCHANGE:saberpro.topic.exchange}
